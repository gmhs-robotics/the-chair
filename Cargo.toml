[workspace]
resolver = "2"
members = [
    "crates/controller",
    "crates/left",
    "crates/right",
    "crates/shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chair-shared = { path = "crates/shared" }
vexide = { version = "0.8.0", features = ["full", "default-sdk"] }
thiserror = { version = "2.0.18" }

[profile.release]
opt-level = "z"
lto = "fat"
