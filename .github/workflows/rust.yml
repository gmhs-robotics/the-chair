name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          # Keep aligned with rust-toolchain.toml.
          toolchain: nightly-2026-03-07
          components: rust-src,rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run host tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Link all V5 firmware
        run: ./build.sh
      - name: Check shell syntax
        run: bash -n build.sh check.sh render-hud.sh upload.sh
