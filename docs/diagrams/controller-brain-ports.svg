<polyline points='790,495 820,495 820,545 850,545' fill='none' stroke='#086baf' stroke-width='3' stroke-linejoin='round' />
<polyline points='495,525 495,742 295,742 295,775' fill='none' stroke='#087f72' stroke-width='3' stroke-linejoin='round' />
<polyline points='705,525 705,742 905,742 905,775' fill='none' stroke='#087f72' stroke-width='3' stroke-linejoin='round' />
<text x='505' y='718' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='700' fill='#087f72'>P19</text>
<text x='715' y='718' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='700' fill='#087f72'>P20</text>
<rect x='100' y='775' width='390' height='110' rx='12' fill='white' stroke='#cbd7e0'/><rect x='100' y='791' width='5' height='78' rx='2' fill='#087f72'/>
<text x='122' y='805' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#087f72'>LEFT CHILD</text>
<text x='122' y='835' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Connect to P21</text>
<rect x='710' y='775' width='390' height='110' rx='12' fill='white' stroke='#cbd7e0'/><rect x='710' y='791' width='5' height='78' rx='2' fill='#087f72'/>
<text x='732' y='805' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#087f72'>RIGHT CHILD</text>
<text x='732' y='835' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Connect to P21</text>
<rect x='40' y='910' width='1120' height='87' rx='10' fill='#e9eff4'/>
<text x='60' y='939' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='700' fill='#b32d45'>RIDER CONTROLS REMAIN ATTACHED</text>
<text x='60' y='967' font-family='DejaVu Sans, sans-serif' font-size='16' font-weight='400' fill='#536879'>Buttons are active LOW. A broken E-stop wire can look released; this is not a monitored safety circuit.</text>
