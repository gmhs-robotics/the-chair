<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1040' viewBox='0 0 1200 1040' role='img' aria-labelledby='title desc'>
<title id='title'>Steering-wheel connections</title><desc id='desc'>ADI letters belong to the master. Smart Port 21 has a different job on each Brain.</desc>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10z' fill='context-stroke'/></marker></defs>
<rect width='1200' height='1040' fill='#f4f7fa'/><rect width='1200' height='8' fill='#086baf'/>
<text x='40' y='44' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>THE CHAIR   /   FIELD GUIDE   /   02</text>
<text x='40' y='88' font-family='DejaVu Sans, sans-serif' font-size='32' font-weight='700' fill='#142b3c'>Steering-wheel connections</text>
<text x='40' y='120' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>ADI letters belong to the master. Smart Port 21 has a different job on each Brain.</text>
<rect x='410' y='300' width='380' height='225' rx='12' fill='white' stroke='#cbd7e0'/><rect x='410' y='316' width='5' height='193' rx='2' fill='#086baf'/>
<text x='432' y='330' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>MASTER</text>
<text x='432' y='360' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>V5 Brain</text>
<text x='432' y='391' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P19 = LEFT data link</text>
<text x='432' y='418' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P20 = RIGHT data link</text>
<text x='432' y='445' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P21 = steering motor</text>
<text x='432' y='472' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P18 = controller radio</text>
<rect x='40' y='170' width='310' height='160' rx='12' fill='white' stroke='#cbd7e0'/><rect x='40' y='186' width='5' height='128' rx='2' fill='#086baf'/>
<text x='62' y='200' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>ADI A</text>
<text x='62' y='230' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Left button</text>
<text x='62' y='261' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>WHEEL: hold to drive</text>
<text x='62' y='288' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>CONTROLLER: coast stop</text>
<rect x='40' y='360' width='310' height='160' rx='12' fill='white' stroke='#cbd7e0'/><rect x='40' y='376' width='5' height='128' rx='2' fill='#b32d45'/>
<text x='62' y='390' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#b32d45'>ADI B</text>
<text x='62' y='420' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Right button</text>
<text x='62' y='451' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Rider E-stop</text>
<text x='62' y='478' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Active in both modes</text>
<rect x='40' y='550' width='310' height='160' rx='12' fill='white' stroke='#cbd7e0'/><rect x='40' y='566' width='5' height='128' rx='2' fill='#086baf'/>
<text x='62' y='580' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>SMART P17</text>
<text x='62' y='610' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Rotation throttle</text>
<text x='62' y='641' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>0–270° forward</text>
<text x='62' y='668' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>ADI C unused</text>
