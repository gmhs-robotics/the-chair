<polyline points='350,440 410,440' fill='none' stroke='#b32d45' stroke-width='3' stroke-linejoin='round' />
<polyline points='350,630 380,630 380,495 410,495' fill='none' stroke='#086baf' stroke-width='3' stroke-linejoin='round' />
<rect x='850' y='220' width='310' height='160' rx='12' fill='white' stroke='#cbd7e0'/><rect x='850' y='236' width='5' height='128' rx='2' fill='#086baf'/>
<text x='872' y='250' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>SMART P18</text>
<text x='872' y='280' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>V5 radio</text>
<text x='872' y='311' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Optional in WHEEL</text>
<text x='872' y='338' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Required in CONTROLLER</text>
<rect x='850' y='465' width='310' height='160' rx='12' fill='white' stroke='#cbd7e0'/><rect x='850' y='481' width='5' height='128' rx='2' fill='#086baf'/>
<text x='872' y='495' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>SMART P21</text>
<text x='872' y='525' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Steering motor</text>
<text x='872' y='556' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Encoder + feedback</text>
<text x='872' y='583' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>1.2 V / 0.4 A cap</text>
