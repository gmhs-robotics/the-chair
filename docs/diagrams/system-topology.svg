<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='680' viewBox='0 0 1200 680' role='img' aria-labelledby='title desc'>
<title id='title'>Three-Brain control layout</title><desc id='desc'>The master calculates commands; each drivetrain Brain controls and monitors four motors.</desc>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10z' fill='context-stroke'/></marker></defs>
<rect width='1200' height='680' fill='#f4f7fa'/><rect width='1200' height='8' fill='#086baf'/>
<rect x='350' y='40' width='500' height='195' rx='12' fill='white' stroke='#cbd7e0'/><rect x='350' y='56' width='5' height='163' rx='2' fill='#086baf'/>
<text x='372' y='70' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>MASTER / SLOT 1</text>
<text x='372' y='100' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Reads controls and commands both sides</text>
<text x='372' y='131' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P17 throttle • P21 steering • optional radio</text>
<text x='372' y='158' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Runs HUD, arming, drive mixing and system safety</text>
<text x='372' y='185' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P19 sends LEFT • P20 sends RIGHT</text>
<polyline points='475,235 475,300 295,300 295,350' fill='none' stroke='#086baf' stroke-width='3' stroke-linejoin='round' marker-end='url(#arrow)'/>
<polyline points='725,235 725,300 905,300 905,350' fill='none' stroke='#086baf' stroke-width='3' stroke-linejoin='round' marker-end='url(#arrow)'/>
<text x='401' y='275' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='700' fill='#086baf'>COMMANDS DOWN • HEALTH BACK</text>
<rect x='40' y='350' width='510' height='230' rx='12' fill='white' stroke='#cbd7e0'/><rect x='40' y='366' width='5' height='198' rx='2' fill='#087f72'/>
<text x='62' y='380' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#087f72'>LEFT / SLOT 2</text>
<text x='62' y='410' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Controls four LEFT motors</text>
<text x='62' y='441' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P21 receives target and returns telemetry</text>
<text x='62' y='468' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P4–P7 drive the LEFT side</text>
<text x='62' y='495' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Checks command lease, motors and battery</text>
<rect x='650' y='350' width='510' height='230' rx='12' fill='white' stroke='#cbd7e0'/><rect x='650' y='366' width='5' height='198' rx='2' fill='#087f72'/>
<text x='672' y='380' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#087f72'>RIGHT / SLOT 3</text>
<text x='672' y='410' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Controls four RIGHT motors</text>
<text x='672' y='441' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P21 receives target and returns telemetry</text>
<text x='672' y='468' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>P4–P7 drive the RIGHT side</text>
<text x='672' y='495' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Checks command lease, motors and battery</text>
</svg>
