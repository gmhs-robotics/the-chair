<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1080' viewBox='0 0 1200 1080' role='img' aria-labelledby='title desc'>
<title id='title'>Drive-node command lifecycle</title><desc id='desc'>Link first, then recoverable motor discovery. First zero starts the 150 ms command lease.</desc>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10z' fill='context-stroke'/></marker></defs>
<rect width='1200' height='1080' fill='#f4f7fa'/><rect width='1200' height='8' fill='#086baf'/>
<text x='40' y='44' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>THE CHAIR   /   FIELD GUIDE   /   04</text>
<text x='40' y='88' font-family='DejaVu Sans, sans-serif' font-size='32' font-weight='700' fill='#142b3c'>Drive-node command lifecycle</text>
<text x='40' y='120' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Link first, then recoverable motor discovery. First zero starts the 150 ms command lease.</text>
<rect x='40' y='170' width='510' height='155' rx='12' fill='white' stroke='#cbd7e0'/><rect x='40' y='186' width='5' height='123' rx='2' fill='#087f72'/>
<text x='62' y='200' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#087f72'>BOOT</text>
<text x='62' y='230' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Open P21; block motor output</text>
<text x='62' y='261' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Do no Smart Motor polling before handshake.</text>
<text x='62' y='288' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Startup motor WAIT never latches a fault.</text>
<rect x='650' y='170' width='510' height='155' rx='12' fill='white' stroke='#cbd7e0'/><rect x='650' y='186' width='5' height='123' rx='2' fill='#086baf'/>
<text x='672' y='200' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>ASSIGN</text>
<text x='672' y='230' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Wait for master on P21</text>
<text x='672' y='261' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Accept protocol v3, side and session.</text>
<text x='672' y='288' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Initialization health grants no motion authority.</text>
<polyline points='550,246 650,246' fill='none' stroke='#086baf' stroke-width='3' stroke-linejoin='round' marker-end='url(#arrow)'/>
<rect x='650' y='410' width='510' height='180' rx='12' fill='white' stroke='#cbd7e0'/><rect x='650' y='426' width='5' height='148' rx='2' fill='#086baf'/>
<text x='672' y='440' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#086baf'>FIRST COMMAND</text>
<text x='672' y='470' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Accept zero; start lease</text>
<text x='672' y='501' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Lost ACK may be retried before first zero.</text>
<text x='672' y='528' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Every later sequence must advance.</text>
<text x='672' y='555' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Duplicate SYN cannot renew an active lease.</text>
<polyline points='905,325 905,410' fill='none' stroke='#086baf' stroke-width='3' stroke-linejoin='round' marker-end='url(#arrow)'/>
<rect x='40' y='410' width='510' height='180' rx='12' fill='white' stroke='#cbd7e0'/><rect x='40' y='426' width='5' height='148' rx='2' fill='#087f72'/>
<text x='62' y='440' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#087f72'>DISCOVER / RUN</text>
<text x='62' y='470' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Discover, then supervise</text>
<text x='62' y='501' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Probe one motor per iteration; wait for 4 stable.</text>
<text x='62' y='528' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>After ready, check motor, battery, loop and duty.</text>
<text x='62' y='555' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Apply bounded ramp or normal Coast.</text>
<polyline points='650,493 550,493' fill='none' stroke='#086baf' stroke-width='3' stroke-linejoin='round' marker-end='url(#arrow)'/>
<polyline points='40,493 20,493 20,375 295,375 295,410' fill='none' stroke='#087f72' stroke-width='3' stroke-linejoin='round' marker-end='url(#arrow)'/>
<text x='70' y='366' font-family='DejaVu Sans, sans-serif' font-size='14' font-weight='700' fill='#087f72'>REPEAT WHILE HEALTHY</text>
<polyline points='295,590 295,660 600,660 600,710' fill='none' stroke='#b32d45' stroke-width='3' stroke-linejoin='round' marker-end='url(#arrow)'/>
<polyline points='905,590 905,660 600,660' fill='none' stroke='#b32d45' stroke-width='3' stroke-linejoin='round' />
<text x='478' y='643' font-family='DejaVu Sans, sans-serif' font-size='16' font-weight='700' fill='#b32d45'>ANY DETECTED FAULT</text>
<rect x='230' y='710' width='740' height='175' rx='12' fill='white' stroke='#cbd7e0'/><rect x='230' y='726' width='5' height='143' rx='2' fill='#b32d45'/>
<text x='252' y='740' font-family='DejaVu Sans, sans-serif' font-size='13' font-weight='700' fill='#b32d45'>LATCHED STOP</text>
<text x='252' y='770' font-family='DejaVu Sans, sans-serif' font-size='23' font-weight='700' fill='#142b3c'>Brake now; keep reporting health</text>
<text x='252' y='801' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Retry local Brake every nominal 10 ms.</text>
<text x='252' y='828' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>No command, reconnect or cooling clears the latch.</text>
<text x='252' y='855' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='400' fill='#536879'>Repair, then restart all three programs.</text>
<rect x='40' y='925' width='1120' height='87' rx='10' fill='#e9eff4'/>
<text x='60' y='954' font-family='DejaVu Sans, sans-serif' font-size='17' font-weight='700' fill='#865900'>LOCAL PROTECTION HAS A HARDWARE LIMIT</text>
<text x='60' y='982' font-family='DejaVu Sans, sans-serif' font-size='16' font-weight='400' fill='#536879'>A frozen CPU, failed SDK or lost supply may prevent braking. Software is not an independent power cut.</text>
<text x='40' y='1058' font-family='DejaVu Sans, sans-serif' font-size='12' font-weight='700' fill='#536879'>SCHEMATIC • NOT TO SCALE</text>
<text x='850' y='1058' font-family='DejaVu Sans, sans-serif' font-size='12' font-weight='400' fill='#536879'>V5 / THREE-BRAIN CONFIGURATION</text>
</svg>
